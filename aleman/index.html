<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung</title>
    <link rel="stylesheet" href="../css/styles_index.css">
</head>
<body>

    <main class="login">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Lerne kostenlos und auf unterhaltsame Weise Englisch, Deutsch und Chinesisch</p>
        </header>

        <section class="formulario">
            <h1>Anmelden</h1>
            <form action="pantalla_principal.html" method="get">
                <div class="campo">
                    <label for="usuario">Benutzername / E-Mail</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">Passwort</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <button type="submit">Anmelden</button>
            </form>

            <div class="enlaces">
                <a href="recuperacion.html">Passwort vergessen?</a>
                <a href="registro.html">Registrieren</a>
            </div>
        </section>

    </main>

</body>
</html>
