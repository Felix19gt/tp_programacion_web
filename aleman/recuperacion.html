<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen</title>
    <link rel="stylesheet" href="../css/styles_recuperacion.css">
</head>
<body>

    <main class="recuperar">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Lerne kostenlos und auf unterhaltsame Weise Englisch, Deutsch und Chinesisch</p>
        </header>

        <section class="formulario">
            <h2>Passwort vergessen?</h2>

            <p>Gib deine E-Mail-Adresse ein, um dein Passwort zurückzusetzen.</p>
            <form action="index.html" method="get">
                 <div class="campo">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit">Zurücksetzen anfordern</button>
            </form>

            <a class="volver" href="index.html">Zurück zur Startseite</a>
        </section>

    </main>

</body>
</html>
