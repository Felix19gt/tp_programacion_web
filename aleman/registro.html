<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren</title>
    <link rel="stylesheet" href="../css/styles_registro.css">
</head>
<body>

    <main class="registro">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Lerne kostenlos und auf unterhaltsame Weise Englisch, Deutsch und Chinesisch</p>
        </header>

        <section class="formulario">
            <h2>Registrieren</h2>

            <form action="index.html" method="get">

                <div class="campo">
                    <label for="nombre">Vollständiger Name</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="usuario">Benutzername</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">Passwort</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <div class="campo">
                    <label for="repetir">Passwort wiederholen</label>
                    <input type="password" id="repetir" required>
                </div>

                <button type="submit">Konto erstellen</button>

            </form>

            <a class="volver" href="index.html">Zurück zur Startseite</a>
        </section>

    </main>

</body>
</html>
