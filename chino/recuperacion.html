<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <link rel="stylesheet" href="../css/styles_recuperacion.css">
</head>
<body>

    <main class="recuperar">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>免费轻松学习英语、德语和中文</p>
        </header>

        <section class="formulario">
            <h2>忘记密码？</h2>

            <p>请输入您的邮箱以找回密码。</p>
            <form action="index.html" method="get">
                 <div class="campo">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit">发送找回邮件</button>
            </form>

            <a class="volver" href="index.html">返回首页</a>
        </section>

    </main>

</body>
</html>
