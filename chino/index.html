<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="../css/styles_index.css">
</head>
<body>

    <main class="login">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>免费轻松学习英语、德语和中文</p>
        </header>

        <section class="formulario">
            <h1>登录</h1>
            <form action="pantalla_principal.html" method="get">
                <div class="campo">
                    <label for="usuario">用户名 / 邮箱</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">密码</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <button type="submit">登录</button>
            </form>

            <div class="enlaces">
                <a href="recuperacion.html">忘记密码？</a>
                <a href="registro.html">注册</a>
            </div>
        </section>

    </main>

</body>
</html>
