<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动课程</title>
    <link rel="stylesheet" href="../css/styles_leccion_interactiva.css">
</head>
<body>

    <main class="leccion-pagina">

        <header class="superior">
            <a href="mapa_de_lecciones_2.html">X</a>

            <div class="progreso">
                <p>进度条：0%</p>
                <div class="barra-progreso-chino">
                    <div></div>
                </div>
            </div>

            <div class="vidas"> 
                ❤️❤️❤️
                <p>生命值：3</p>
            </div>
        </header>

        <section class="ejercicio">

            <h1>请翻译以下句子：</h1>

            <p class="frase">"早上好，你好吗"</p>
            <p class="audio">
                <audio controls>
                    <source src="../audio/auidochino.mp3" type="audio/mpeg">
                </audio>
            </p>

            <div class="respuesta">
                <span>Buenos</span>
                <span>días</span>
                <span>¿cómo</span>
                <span>estás?</span>
            </div>

            <h2>可用词库：</h2>

            <div class="banco">
                <button>Hola</button>
                <button>días</button>
                <button>estás?</button>
                <button>Gracias</button>
                <button>¿cómo</button>
                <button>Buenos</button>
                <button>Adiós</button>
            </div>

            <a href="mapa_de_lecciones_2.html">检查答案</a>

        </section>

    </main>

</body>
</html>
