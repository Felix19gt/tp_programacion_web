<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="../css/styles_registro.css">
</head>
<body>

    <main class="registro">

        <header class="cabecera">
            <img src="../img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>免费轻松学习英语、德语和中文</p>
        </header>

        <section class="formulario">
            <h2>注册</h2>

            <form action="index.html" method="get">

                <div class="campo">
                    <label for="nombre">全名</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="usuario">用户名</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">密码</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <div class="campo">
                    <label for="repetir">确认密码</label>
                    <input type="password" id="repetir" required>
                </div>

                <button type="submit">创建账户</button>

            </form>

            <a class="volver" href="index.html">返回首页</a>
        </section>

    </main>

</body>
</html>
