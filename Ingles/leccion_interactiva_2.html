<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Interactive Lesson</title>
    <link rel="stylesheet" href="../css/styles_leccion_interactiva.css">

<body>

    <main class="leccion-pagina">

        <header class="superior">
            <a href="mapa_de_lecciones_2.html">X</a>

        <section class="ejercicio">

            <h1>Translate the following sentence:</h1>

            <p class="frase">"Guten Morgen, wie geht es dir?"</p>
            <p class="audio">
                <audio controls>
                    <source src="../audio/audioaleman.mp3" type="audio/mpeg">

            </p>

            <div class="respuesta">
                <span>Buenos</span>
                <span>días</span>
                <span>¿cómo</span>
                <span>estás?</span>
            </div>

            <h2>Available word bank:</h2>

            <div class="banco">
                <button>Hola</button>
                <button>días</button>
                <button>estás?</button>
                <button>Gracias</button>
                <button>¿cómo</button>
                <button>Buenos</button>
                <button>Adiós</button>
            </div>

            <a href="mapa_de_lecciones_2.html">Check Answer</a>

        </section>
