<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover password</title>
    <link rel="stylesheet" href="../css/styles_recuperacion.css">
</head>
<body>

    <main class="recuperar">

        <header class="cabecera">
            <img src="img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Learn English, German and Chinese for free in a fun way</p>
        </header>

        <section class="formulario">
            <h2>Forgot your password?</h2>

            <p>Enter your email to recover your password.</p>
            <form action="index.html" method="get">
                 <div class="campo">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit">Send recovery email</button>
            </form>

            <a class="volver" href="index.html">Back to home</a>
        </section>

    </main>

</body>
</html>
