<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="../css/styles_registro.css">
</head>
<body>

    <main class="registro">

        <header class="cabecera">
            <img src="img/logo_azul.png" alt="Logo">
            <div class="logotipo">LingoLeon</div>
            <p>Learn English, German and Chinese for free in a fun way</p>
        </header>

        <section class="formulario">
            <h2>Sign up</h2>

            <form action="index.html" method="get">

                <div class="campo">
                    <label for="nombre">Full name</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="usuario">Username</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="contrasenia">Password</label>
                    <input type="password" id="contrasenia" required>
                </div>

                <div class="campo">
                    <label for="repetir">Repeat password</label>
                    <input type="password" id="repetir" required>
                </div>

                <button type="submit">Create account</button>

            </form>

            <a class="volver" href="index.html">Back to home</a>
        </section>

    </main>

</body>
</html>
